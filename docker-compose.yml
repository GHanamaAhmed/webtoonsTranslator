version: '3.8'

services:
  prod:
    container_name: ManhwaVision-prod
    build:
      context: ./
      dockerfile: Dockerfile # Assuming the Dockerfile is named dev.Dockerfile
      target: prod
    env_file:
      - .env.production # Loads environment variables from the .env file
    ports:
      - '3000:3000' # Expose port 3000 for the Next.js app
    restart: always # Auto-restart if the container fails
  dev:
    container_name: ManhwaVision-dev
    build:
      context: ./
      dockerfile: Dockerfile
      target: dev
    env_file:
      - .env.development
    ports:
      - '3000:3000' # Expose port 3000 for the Next.js app
    restart: always # Auto-restart if the container fails
networks:
  my_network:
    external: true
