version: '3.8'

services:
  nextjs-app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - '3000:3000'
    environment:
      - NODE_ENV=production
    volumes:
      - .:/app
    command: npm run start
    depends_on:
      - node_modules_volume

  node_modules_volume:
    image: busybox
    volumes:
      - /app/node_modules
